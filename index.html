<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel处理工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #5568d3;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #5568d3;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 14px;
        }

        .upload-text .highlight {
            color: #667eea;
            font-weight: bold;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
            word-break: break-all;
        }

        .file-info.show {
            display: block;
        }

        .file-info .label {
            color: #666;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .file-info .name {
            color: #333;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .btn-download {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: none;
        }

        .btn-download.show {
            display: block;
        }

        .btn-download:hover {
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel 处理工具</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">
                点击或拖拽 Excel 文件到此处
            </div>
            <input type="file" id="fileInput" accept=".xlsx, .xls">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="label">已选择文件：</div>
            <div class="name" id="fileName"></div>
        </div>

        <div class="status" id="status"></div>

        <button class="btn" id="processBtn" disabled title="源文件需包含前两列数据，新内容将生成到第三列和第四列">生成盘号</button>
        <button class="btn" id="dedupeBtn" disabled>去重</button>
        <button class="btn btn-download" id="downloadBtn">下载处理后的 Excel</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameEl = document.getElementById('fileName');
        const processBtn = document.getElementById('processBtn');
        const dedupeBtn = document.getElementById('dedupeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusEl = document.getElementById('status');

        let currentFile = null;
        let processedWorkbook = null;

        function showStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = 'status show ' + type;
        }

        function hideStatus() {
            statusEl.className = 'status';
        }

        function handleFile(file) {
            if (!file) return;

            const fileName = file.name.toLowerCase();
            if (!fileName.endsWith('.xlsx') && !fileName.endsWith('.xls')) {
                showStatus('请选择 Excel 文件（.xlsx 或 .xls）', 'error');
                return;
            }

            currentFile = file;
            fileNameEl.textContent = file.name;
            fileInfo.classList.add('show');
            processBtn.disabled = false;
            dedupeBtn.disabled = false;
            downloadBtn.classList.remove('show');
            processedWorkbook = null;
            hideStatus();
        }

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        processBtn.addEventListener('click', () => {
            if (!currentFile) return;

            showStatus('正在处理文件...', 'info');
            processBtn.disabled = true;

            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:A1');
                    const col1Letter = XLSX.utils.encode_col(0);
                    const col3Letter = XLSX.utils.encode_col(2);
                    const col4Letter = XLSX.utils.encode_col(3);

                    let processedCount = 0;
                    for (let row = range.s.r; row <= range.e.r; row++) {
                        const cellAddress = col1Letter + (row + 1);
                        const cell = worksheet[cellAddress];
                        if (cell && cell.v !== undefined && cell.v !== null && String(cell.v).trim() !== '') {
                            const originalValue = String(cell.v).toUpperCase();
                            const newValue1 = "'" + originalValue + "',";
                            const newValue2 = '"' + originalValue + '",';
                            const col3Address = col3Letter + (row + 1);
                            const col4Address = col4Letter + (row + 1);
                            worksheet[col3Address] = { t: 's', v: newValue1 };
                            worksheet[col4Address] = { t: 's', v: newValue2 };
                            processedCount++;
                        }
                    }

                    if (!worksheet['!ref']) {
                        worksheet['!ref'] = 'A1';
                    } else {
                        const newRange = {
                            s: { c: 0, r: range.s.r },
                            e: { c: Math.max(range.e.c, 3), r: range.e.r }
                        };
                        worksheet['!ref'] = XLSX.utils.encode_range(newRange);
                    }

                    processedWorkbook = workbook;
                    showStatus(`处理完成！共处理 ${processedCount} 行数据`, 'success');
                    downloadBtn.classList.add('show');
                } catch (err) {
                    showStatus('处理失败：' + err.message, 'error');
                } finally {
                    processBtn.disabled = false;
                }
            };

            reader.onerror = () => {
                showStatus('文件读取失败', 'error');
                processBtn.disabled = false;
            };

            reader.readAsArrayBuffer(currentFile);
        });

        dedupeBtn.addEventListener('click', () => {
            if (!currentFile) return;

            showStatus('正在处理文件...', 'info');
            dedupeBtn.disabled = true;

            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:A1');
                    const col1Letter = XLSX.utils.encode_col(0);

                    const values = [];
                    for (let row = range.s.r; row <= range.e.r; row++) {
                        const cellAddress = col1Letter + (row + 1);
                        const cell = worksheet[cellAddress];
                        if (cell && cell.v !== undefined && cell.v !== null && String(cell.v).trim() !== '') {
                            values.push(String(cell.v));
                        }
                    }

                    const uniqueValues = [...new Set(values)];
                    for (let i = 0; i < uniqueValues.length; i++) {
                        const col1Address = col1Letter + (i + 1);
                        worksheet[col1Address] = { t: 's', v: uniqueValues[i] };
                    }

                    const newRange = {
                        s: { c: 0, r: 0 },
                        e: { c: 0, r: Math.max(uniqueValues.length - 1, 0) }
                    };
                    worksheet['!ref'] = XLSX.utils.encode_range(newRange);

                    processedWorkbook = workbook;
                    showStatus(`去重完成！去重前 ${values.length} 条，去重后 ${uniqueValues.length} 条`, 'success');
                    downloadBtn.classList.add('show');
                } catch (err) {
                    showStatus('处理失败：' + err.message, 'error');
                } finally {
                    dedupeBtn.disabled = false;
                }
            };

            reader.onerror = () => {
                showStatus('文件读取失败', 'error');
                dedupeBtn.disabled = false;
            };

            reader.readAsArrayBuffer(currentFile);
        });

        downloadBtn.addEventListener('click', () => {
            if (!processedWorkbook) return;

            try {
                const wbout = XLSX.write(processedWorkbook, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const originalName = currentFile.name.replace(/\.[^/.]+$/, '');
                a.href = url;
                a.download = originalName + '_处理后.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('文件下载已开始', 'success');
            } catch (err) {
                showStatus('下载失败：' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
